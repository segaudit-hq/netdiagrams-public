# Publishes to PyPI from the public repository (PyPI trusted publishing, no token): on a v* tag, or run by hand
# from the Actions tab. PyPI refuses a version it already has, so bump netdiagrams.__version__ first.
name: Publish to PyPI

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    if: github.repository == 'segaudit-hq/netdiagrams-public'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: |
          python -m pip install build
          python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
