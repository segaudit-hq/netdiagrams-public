[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "netdiagrams"
dynamic = ["version"]
description = "Generate network diagrams from NetBox: zoned draw.io drawings for audits, segmentation and documentation."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = ["netbox", "netbox diagram", "network diagram", "network topology", "draw.io", "drawio", "network documentation", "network segmentation", "purdue model", "iec 62443", "pci dss"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Networking",
]
requires-python = ">=3.9"
dependencies = []

[project.urls]
Homepage = "https://netdiagrams.com"
Source = "https://github.com/segaudit-hq/netdiagrams-public"
Guides = "https://netdiagrams.com/tips/"
Documentation = "https://github.com/segaudit-hq/netdiagrams-public/blob/main/docs/reference.md"
Issues = "https://github.com/segaudit-hq/netdiagrams-public/issues"

[project.scripts]
netdiagrams = "netdiagrams.cli:main"

[tool.setuptools.dynamic]
version = {attr = "netdiagrams.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
netdiagrams = ["data/*"]
